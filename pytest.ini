[pytest]
addopts = -p pytest_asyncio --import-mode=importlib
testpaths =
    src/tests/backend
    src/tests/agents
markers =
    integration: marks tests as integration tests requiring real Azure infrastructure (deselect with '-m "not integration"')
    unit: marks tests as fast unit tests with no external dependencies
    e2e: marks tests as end-to-end Playwright tests requiring a running frontend
    integration: marks tests as integration tests requiring real Azure backend + credentials
