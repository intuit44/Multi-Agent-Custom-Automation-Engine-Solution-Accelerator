# ------------------------------------------------------------------------------
# Dependabot Auto-Merge
#
# Flujo: dependabot.yml etiqueta cada PR de dependabot con "auto-merge".
# Este workflow habilita el auto-merge NATIVO de GitHub (squash) en ese PR;
# GitHub lo mergea únicamente cuando TODOS los required checks de main pasan.
#
# Requisitos (configuración del repo — sin ellos el job falla cerrado):
#   - Protección de rama en `main` con required status checks
#   - "Allow auto-merge" habilitado (Settings → General) [ya activo]
#
# Nota: sin required checks, `gh pr merge --auto` mergea AL INSTANTE sin
# esperar validación alguna. El primer paso verifica la protección y aborta
# si no existe — nunca se arma un merge sin gates.
# ------------------------------------------------------------------------------

name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que main tiene required checks (falla cerrado)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          checks=$(gh api "repos/${{ github.repository }}/branches/main/protection/required_status_checks" --jq '.checks | length' 2>/dev/null) || {
            echo "::error::main no tiene protección de rama con required checks — el auto-merge saltaría todos los gates. Configurar la protección primero."
            exit 1
          }
          if [ "${checks:-0}" -eq 0 ]; then
            echo "::error::La protección existe pero con CERO required checks configurados."
            exit 1
          fi
          echo "Required checks en main: $checks"

      - name: Habilitar auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
