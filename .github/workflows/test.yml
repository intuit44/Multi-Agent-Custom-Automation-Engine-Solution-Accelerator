name: Test Workflow with Coverage

on:
  push:
    branches:
      - main
      - demo-v4
      - dev-v4
    paths:
      - 'src/backend/**/*.py'
      - 'src/tests/**/*.py'
      - 'src/mcp_server/**/*.py'
      - 'src/**/pyproject.toml'
      - 'pytest.ini'
      - 'conftest.py'
      - 'src/backend/requirements.txt'
      - 'src/backend/uv.lock'
      - '.github/workflows/test.yml'
  # Sin filtro de paths en PR: "test" será required check de la protección
  # de main — si el workflow no corre, el PR queda colgado en "Expected".
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    branches:
      - main
      - demo-v4
      - dev-v4

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock

      # uv sync --frozen installs EXACTLY what uv.lock pins — direct AND
      # transitive dependencies. pip resolution can silently promote an
      # unpinned transitive to a newer stable (the agent-framework packages
      # left preview, so stables now exist above the rc pins); the lockfile
      # cannot.
      - name: Install dependencies (exact uv.lock)
        run: uv sync --frozen
        working-directory: src/backend

      - name: Debug SDK exports
        working-directory: src/backend
        run: |
          uv run python -c "import agent_framework_azure_ai; print('Version:', agent_framework_azure_ai.__version__); print('Has AzureAIProjectAgentOptions:', hasattr(agent_framework_azure_ai, 'AzureAIProjectAgentOptions')); print('All exports:', [x for x in dir(agent_framework_azure_ai) if not x.startswith('_')])"

      - name: Check if test files exist
        id: check_tests
        run: |
          if [ -z "$(find src/tests -type f -name 'test_*.py' 2>/dev/null)" ]; then
            echo "No test files found, skipping tests."
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "Test files found, running tests."
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: Run tests with coverage
        if: steps.check_tests.outputs.run == 'true'
        working-directory: src/backend
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src/backend
        run: |
          # test_app.py requires isolation — run first, separate coverage session
          uv run python -m pytest ../../src/tests/backend/test_app.py \
            --cov=. --cov-config=../../.coveragerc -q

          # test_context_recovery_probe.py imports the real v4.api.router
          # module chain. Several other backend tests replace sys.modules
          # entries for v4.*/auth.* with unittest.mock objects at import time
          # and never restore them, which corrupts that import if it runs
          # after them — so it needs the same isolation as test_app.py.
          uv run python -m pytest ../../src/tests/backend/v4/api/test_context_recovery_probe.py \
            --cov=. --cov-append --cov-config=../../.coveragerc -q

          # Remaining backend tests — append to the same coverage data
          uv run python -m pytest ../../src/tests/backend \
            --cov=. --cov-append \
            --cov-report=term --cov-report=xml \
            --cov-config=../../.coveragerc \
            --ignore=../../src/tests/backend/test_app.py \
            --ignore=../../src/tests/backend/v4/api/test_context_recovery_probe.py

      - name: Check coverage threshold
        if: steps.check_tests.outputs.run == 'true'
        working-directory: src/backend
        run: |
          if [ -f coverage.xml ]; then
            COVERAGE=$(uv run python -c "import xml.etree.ElementTree as ET; t=ET.parse('coverage.xml'); print(float(t.getroot().attrib.get('line-rate',0))*100)")
            echo "Overall coverage: $COVERAGE%"
            if (( $(echo "$COVERAGE < 45" | bc -l) )); then
              echo "::error::Coverage is below 45% threshold. Current: $COVERAGE%"
              exit 1
            fi
            echo "Coverage threshold met: $COVERAGE% >= 45%"
          else
            echo "::error::coverage.xml not found"
            exit 1
          fi

      - name: Skip coverage report if no tests
        if: steps.check_tests.outputs.run != 'true'
        run: echo "Skipping coverage — no test files found."
