name: Quality Gate

# Sin filtro de paths: estos jobs serán required checks de la protección de
# main — un check requerido cuyo workflow no corre deja el PR colgado en
# "Expected" para siempre (p. ej. un PR solo de docs).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Backend: ruff + mypy (via uv, no pip resolution) ──────────────────────
  backend-quality:
    name: Backend (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock

      - name: Install (exact lock)
        run: uv sync --frozen
        working-directory: src/backend

      # Rutas relativas al working-directory: `.` es src/backend.
      # (src/tests queda FUERA del gate: 847 errores de lint heredados,
      # pendiente de la reorganización de tests.)
      - name: Ruff — lint
        run: uv run ruff check .
        working-directory: src/backend

      - name: Ruff — format check
        run: uv run ruff format --check .
        working-directory: src/backend

      - name: mypy
        run: uv run mypy .
        working-directory: src/backend

  # ── MCP server: ruff ─────────────────────────────────────────────────────
  mcp-quality:
    name: MCP server (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: src/mcp_server/uv.lock

      # --extra dev: en mcp_server las herramientas viven en
      # [project.optional-dependencies].dev — un sync pelado no las instala
      # y `uv run ruff` caería al PATH del runner (donde no hay ruff).
      - name: Install (exact lock)
        run: uv sync --frozen --extra dev
        working-directory: src/mcp_server

      # --no-sync: sin él, uv run re-sincroniza SIN extras y desinstala ruff.
      - name: Ruff — lint
        run: uv run --no-sync ruff check .
        working-directory: src/mcp_server

      - name: Ruff — format check
        run: uv run --no-sync ruff format --check .
        working-directory: src/mcp_server

  # ── Frontend: ESLint + tsc build ─────────────────────────────────────────
  frontend-quality:
    name: Frontend (ESLint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: src/frontend

      - name: ESLint
        run: npm run lint
        working-directory: src/frontend

      - name: TypeScript build
        run: npm run build
        working-directory: src/frontend
