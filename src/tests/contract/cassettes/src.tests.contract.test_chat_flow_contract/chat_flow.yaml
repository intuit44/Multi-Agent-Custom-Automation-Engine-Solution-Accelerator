        {"object": "agent", "id": "Experimento", "name": "Experimento", "state": "enabled",
        "versions": {"latest": {"metadata": {}, "object": "agent.version", "id": "Experimento:4",
        "name": "Experimento", "version": "4", "description": "", "created_at": 1782018262,
        "definition": {"kind": "workflow", "id": "", "name": "Experimento", "workflow":
        "kind: workflow\ntrigger:\n  kind: OnConversationStart\n  id: trigger_wf\n  actions:\n    -
        kind: SetVariable\n      id: set_variable_input_task\n      variable: Local.UserInput\n      value:
        =UserMessage(System.LastMessageText)\n    - kind: InvokeAzureAgent\n      id:
        student_agent\n      description: The student node\n      conversationId:
        =System.ConversationId\n      agent:\n        name: ChatMCPAgent\n      input:\n        messages:
        =Local.UserInput\n      output:\n        messages: Local.StudentMessages\n        autoSend:
        false\n        responseObject: Local.StudentResult\n    - kind: InvokeAzureAgent\n      id:
        teacher_agent\n      description: The teacher node\n      conversationId:
        =System.ConversationId\n      agent:\n        name: ProxyAgent\n      input:\n        messages:
        =Local.StudentMessages\n      output:\n        messages: Local.TeacherMessages\n        autoSend:
        false\n        responseObject: Local.TeacherResult\n    - kind: SendActivity\n      id:
        send_teacher_message\n      activity: =Last(Local.TeacherMessages)\n    -
        kind: SetVariable\n      id: set_variable_turncount\n      variable: Local.TurnCount\n      value:
        =Coalesce(Local.TurnCount, 0) + 1\n    - kind: ConditionGroup\n      id: completion_check\n      conditions:\n        -
        condition: =!IsBlank(Find(\"[COMPLETE]\", Upper(Last(Local.TeacherMessages).Text)))\n          id:
        check_done\n          actions:\n            - kind: EndConversation\n              id:
        end_workflow\n        - condition: =Local.TurnCount >= 4\n          id: check_turn_count_exceeded\n          actions:\n            -
        kind: SendActivity\n              id: send_activity_tired\n              activity:
        Let''s try again later...I am tired.\n      elseActions:\n        - kind:
        GotoAction\n          id: goto_student_agent\n          actionId: student_agent\nid:
        \"\"\nname: Experimento\n"}, "draft": false, "status": "active", "instance_identity":
