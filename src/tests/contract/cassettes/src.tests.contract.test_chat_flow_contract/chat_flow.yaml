        Real source_blobs are filenames (e.g. 'NDA_file.docx') or\\\\n\\\"\\n    \\\"
        \   full SharePoint/Blob URLs.\\\\n\\\\n\\\"\\n    \\\"Parameters:\\\\n\\\"\\n
        \   \\\"  - query: Natural language search (e.g. 'NDA Contoso risks', 'customer
        churn Q1')\\\\n\\\"\\n    \\\"  - source_type: 'all' (default), 'chat' (history
        only), 'documents' (docs only)\\\\n\\\\n\\\"\\n    \\\"\u2550\u2550\u2550
