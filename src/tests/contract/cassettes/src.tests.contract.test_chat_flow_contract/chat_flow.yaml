        "description": "Connect to an external MCP server.\n\nEstablishes a JSON-RPC
        session with the target server,\nperforming the full MCP handshake (initialize
        + initialized).\n\nSupports two modes:\n- **Direct URL**: provide ``server_url``
        (and optionally\n  ``server_name``).\n- **Registry lookup**: provide ``server_name``
        only; the\n  endpoint URL is resolved from the Cosmos DB catalog.\n\nArgs:\n    server_url:
        Full URL of the MCP server endpoint\n               (e.g., \"http://host:port/mcp\").\n               Leave
        empty to look up by server_name.\n    server_name: Friendly name for the server.\n                 Auto-generated
        from URL if not provided.\n\nReturns:\n    Connection status with server info
