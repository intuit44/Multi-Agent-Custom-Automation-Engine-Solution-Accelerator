        {"anyOf": [{"additionalProperties": true, "type": "object"}, {"type": "null"}],
        "default": null}, "server_name": {"type": "string"}, "target_tool": {"type":
        "string"}}, "required": ["server_name", "target_tool"], "type": "object"},
