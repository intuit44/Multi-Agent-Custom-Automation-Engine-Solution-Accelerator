[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "azure-ai-evaluation==1.11.0",
    "azure-ai-inference==1.0.0b9",
    "azure-ai-projects==2.0.0",
    "azure-cosmos==4.9.0",
    "azure-identity==1.24.0",
    "azure-monitor-events-extension==0.1.0",
    "azure-monitor-opentelemetry==1.8.5",
    "azure-search-documents==11.5.3",
    "fastapi==0.116.1",
    "openai==2.16.0",
    "opentelemetry-api==1.39.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.39.0",
    "opentelemetry-exporter-otlp-proto-http==1.39.0",
    "opentelemetry-instrumentation-fastapi==0.60b0",
    "opentelemetry-instrumentation-openai==0.46.2",
    "opentelemetry-sdk==1.39.0",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.31",
    "uvicorn[standard]==0.35.0",
    "pylint-pydantic==0.3.5",
    "pexpect==4.9.0",
    "mcp==1.28.1",
    "werkzeug==3.1.6",
    "azure-core==1.38.0",
    "agent-framework-azure-ai==1.0.0rc6",
    "agent-framework-core==1.0.0rc6",
    "agent-framework-orchestrations==1.0.0b260311",
    "urllib3==2.7.0",
    "protobuf==5.29.6",
    "cryptography==50.0.0",
    "aiohttp==3.14.3",
    "pyasn1==0.6.4",
    "nltk==3.10.0",
    "httpx>=0.27.0",
    "azure-keyvault-secrets>=4.11.0",
    "agent-framework-openai==1.0.0rc6",
    "azure-storage-blob>=12.27.1",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["azure.functions", "azure.monitor.events.extension"]
ignore_missing_imports = true

[tool.fastapi]
entrypoint = "app:app"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.1",
    # 1.4+: 0.24 fugaba un event loop "de repuesto" por test (destapado por el
    # gate error::ResourceWarning en pytest.ini)
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    # <0.16: la 0.16 amplió el set de reglas por defecto (+178 hallazgos);
    # se adopta vía PR de dependabot evaluando esos hallazgos, no de contrabando
    "ruff>=0.15.7,<0.16",
    "types-regex",
    "types-python-dateutil",
    "types-requests",
]
