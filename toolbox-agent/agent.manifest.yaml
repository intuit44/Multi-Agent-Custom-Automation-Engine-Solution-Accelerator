name: toolbox-agent
description: >
  An Agent Framework agent with Foundry Toolbox integration.
metadata:
  tags:
    - Agent Framework
    - AI Agent Hosting
    - Azure AI AgentServer
    - Responses Protocol
    - Streaming
template:
  name: toolbox-agent
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "o4-mini"
    - name: TOOLBOX_NAME
      value: "Toolbox"
parameters:
  properties: []

