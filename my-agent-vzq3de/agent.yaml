# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

name: my-agent-vzq3de
kind: hosted
protocols:
  - protocol: responses
    version: 1.0.0
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
description: >
  A long-running agent that demonstrates the background execution pattern using the azure-ai-agentserver-responses SDK.
  Processes requests asynchronously via background=true, streaming LLM tokens as they arrive. Supports polling and
  cancellation.
metadata:
  tags:
    - AI Agent Hosting
    - Responses Protocol
    - Bring Your Own
    - Background Mode
    - Python
resources:
  cpu: '1.0'
  memory: 2.0Gi
dockerfile_path: Dockerfile
